<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P5 Client Hours</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pillar 5 Group client hours tracker: staff log time per project, managers approve, the client sees hours used against the 45 paid hours per 2-week cycle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky header with role switch, tab bar (bottom bar on phones), one content column up to 1120px */
/* Brand: Pillar 5 navy and gold. Navy carries actions, gold marks extra delivered hours. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E7EBF3; --ink:#0A1738; --muted:#4B5876; --line:#D2D9E6;
  --accent:#0F2A66; --accent-hover:#0A1738; --accent-ink:#FFFFFF; --accent-soft:#E3E9F6;
  --gold:#D49A35; --seg:#0F2A66; --seg-x:#D49A35;
  --ok:#166534; --ok-soft:#DCF2E3; --warn:#8A5300; --warn-soft:#FBEFD2; --bad:#B42318; --bad-soft:#FBE1DE;
  --extra:#7A4E0A; --extra-soft:#FAEDD3;
  --d0:#1E3A8A; --d1:#B8791C; --d2:#0F766E; --d3:#5B6B8C; --d4:#0369A1; --d5:#A21CAF;
  --focus:#0F2A66;
  --shadow:0 1px 2px rgba(10,23,56,.06),0 6px 18px rgba(10,23,56,.06);
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060D22; --surface:#0D1A3A; --surface-2:#142450; --ink:#EEF1F8; --muted:#A9B5D0; --line:#25386A;
  --accent:#E3AE4F; --accent-hover:#F0C57A; --accent-ink:#0A1738; --accent-soft:#1B2D5C;
  --gold:#E3AE4F; --seg:#7E9AE6; --seg-x:#F0C57A;
  --ok:#5BE08F; --ok-soft:#153626; --warn:#F7C948; --warn-soft:#3A3013; --bad:#FF8A80; --bad-soft:#40201F;
  --extra:#F0C57A; --extra-soft:#3A2D12;
  --d0:#8FA8E8; --d1:#E3AE4F; --d2:#34D3BD; --d3:#A9B5D0; --d4:#56C2F5; --d5:#F08AF0;
  --focus:#F0C57A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#060D22; --surface:#0D1A3A; --surface-2:#142450; --ink:#EEF1F8; --muted:#A9B5D0; --line:#25386A;
  --accent:#E3AE4F; --accent-hover:#F0C57A; --accent-ink:#0A1738; --accent-soft:#1B2D5C;
  --gold:#E3AE4F; --seg:#7E9AE6; --seg-x:#F0C57A;
  --ok:#5BE08F; --ok-soft:#153626; --warn:#F7C948; --warn-soft:#3A3013; --bad:#FF8A80; --bad-soft:#40201F;
  --extra:#F0C57A; --extra-soft:#3A2D12;
  --d0:#8FA8E8; --d1:#E3AE4F; --d2:#34D3BD; --d3:#A9B5D0; --d4:#56C2F5; --d5:#F08AF0;
  --focus:#F0C57A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--gold)}
.top-in{max-width:1120px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.logo{background:#fff;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;padding:2px 6px;flex:none}
.logo img{display:block;height:44px;width:auto;max-width:none}
.logo-lg{padding:4px 10px}
.logo-lg img{height:84px}
.rep-brand{display:flex;flex-wrap:wrap;align-items:center;gap:16px;min-width:0}
.brand-t{min-width:0}
.brand-t strong{display:block;font-size:1rem}
.brand-t span{display:block;font-size:.8125rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg-ctl{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg-ctl button{min-height:38px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:.875rem;font-weight:600;cursor:pointer;transition:background-color .18s,color .18s}
.seg-ctl button:hover{color:var(--ink)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:6px}
.who label{font-size:.8125rem;color:var(--muted)}

/* Tabs: bottom bar on phones, row on wider screens */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs ul{list-style:none;margin:0;padding:0;display:flex}
.tabs li{flex:1}
.tabs button{width:100%;min-height:58px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.75rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;transition:color .18s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:.6875rem;font-weight:700}
.tabs .badge{position:absolute;top:6px;left:calc(50% + 6px)}
@media (min-width:768px){
  .tabs{position:static;border-top:0;border-bottom:1px solid var(--line);padding:0}
  .tabs ul{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:4px}
  .tabs li{flex:none}
  .tabs button{flex-direction:row;font-size:.9375rem;min-height:48px;padding:0 14px;gap:8px}
  .tabs button[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
  .tabs .badge{position:static}
}

/* Main */
main{max-width:1120px;margin:0 auto;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
@media (min-width:768px){main{padding-block:24px 48px}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:16px;min-width:0;align-content:start}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.grid2{display:grid;gap:20px}
@media (min-width:1024px){.grid2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.demo-note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:.875rem}

/* Cycle nav */
.cyc{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.cyc-t{text-align:center;padding:0 6px;min-width:0}
.cyc-t strong{display:block;font-size:.9375rem;white-space:nowrap}
.cyc-t span{display:block;font-size:.75rem;color:var(--muted)}

/* Buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.9375rem;cursor:pointer;transition:background-color .18s,border-color .18s,color .18s,transform .18s;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn-ok:hover{filter:brightness(1.08);background:var(--ok)}
.btn-bad{color:var(--bad);border-color:var(--bad)}
.btn-bad:hover{background:var(--bad-soft)}
.btn-ghost{border-color:transparent;background:transparent}
.icon-btn{width:44px;min-height:44px;padding:0;border-radius:999px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background-color .18s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:.875rem;font-weight:600}
.field .hint{font-size:.8125rem;color:var(--muted)}
.field .err{font-size:.8125rem;color:var(--bad);font-weight:600}
input,select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px 12px;width:100%;transition:border-color .18s}
textarea{min-height:88px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--bad)}
select{cursor:pointer}
.row2{display:grid;gap:12px}
@media (min-width:560px){.row2{grid-template-columns:1fr 1fr}.row3{grid-template-columns:1fr 1fr 1fr}}
.who select{min-height:38px;padding:4px 10px;font-size:.875rem;width:auto;max-width:220px}

/* Timer */
.clock{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:clamp(2.75rem,10vw,4rem);font-weight:600;letter-spacing:-.02em;line-height:1}
.timer-state{display:flex;align-items:center;gap:8px;font-size:.875rem;font-weight:600}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.pulse.paused{background:var(--warn)}
.pulse.idle{background:var(--muted)}
@media (prefers-reduced-motion:no-preference){.pulse.on{animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}}
details.manual{border-top:1px solid var(--line);padding-top:14px}
details.manual summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
details.manual summary::-webkit-details-marker{display:none}
details.manual summary::before{content:"+";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface-2);font-weight:700}
details.manual[open] summary::before{content:"\2212"}
details.manual form{display:grid;gap:12px;margin-top:8px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:768px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0}
.stat .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:1.75rem;font-weight:600;line-height:1.1}
.stat .v small{font-size:.875rem;color:var(--muted);font-weight:500}
.stat .s{font-size:.8125rem;color:var(--muted)}
.stat.is-extra{border-color:var(--extra);background:var(--extra-soft)}
.stat.is-extra .v{color:var(--extra)}
.stat.is-low{border-color:var(--warn);background:var(--warn-soft)}

/* Meter */
.meter{display:grid;gap:10px;padding-top:26px}
.meter-track{position:relative;display:flex;height:22px;border-radius:6px;background:var(--surface-2);overflow:visible}
.meter-track .sg{height:100%;display:block}
.meter-track .sg:first-child{border-radius:6px 0 0 6px}
.sg-a{background:var(--seg)}
.sg-x{background:var(--seg-x)}
.sg-p{background:repeating-linear-gradient(135deg,var(--muted) 0 5px,var(--surface-2) 5px 10px)}
.mark{position:absolute;top:-26px;bottom:-4px;width:0;border-left:2px dashed var(--ink)}
.mark span{position:absolute;right:6px;top:0;white-space:nowrap;font-size:.75rem;font-weight:700}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.8125rem;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}

/* Horizontal bars */
.hbars{display:grid;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(96px,140px) minmax(0,1fr) auto;align-items:center;gap:12px}
.hbar-l{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9375rem;min-width:0}
.hbar-l span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.hbar-t{height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hbar-t span{display:block;height:100%;border-radius:4px}
.hbar-v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:.875rem;text-align:right;min-width:92px}
.hbar-v small{color:var(--muted)}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-family:var(--font-body);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--seg)}
.chart .bar-today{fill:var(--seg-x)}
.chart .base{stroke:var(--muted);stroke-width:1}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.nw{white-space:nowrap}
tfoot td{font-weight:700;background:var(--surface-2)}
.note-cell{min-width:220px;max-width:360px}

/* Entries */
.entries{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.entry-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.entry-meta{font-size:.8125rem;color:var(--muted)}
.entry-note{font-size:.9375rem;margin-top:4px;overflow-wrap:anywhere}
.entry-dur{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.entry-act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.reason{font-size:.8125rem;background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:6px 10px;margin-top:6px}
.reject-box{grid-column:1/-1;display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-approved{background:var(--ok-soft);color:var(--ok)}
.p-pending{background:var(--warn-soft);color:var(--warn)}
.p-rejected{background:var(--bad-soft);color:var(--bad)}
.p-manual{background:var(--surface-2);color:var(--muted)}
.p-timer{background:var(--accent-soft);color:var(--accent)}
a{color:var(--accent)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Report */
.verdict{border-radius:var(--r);padding:18px 20px;display:grid;gap:6px}
.verdict.v-extra{background:var(--extra-soft)}
.verdict.v-normal{background:var(--accent-soft)}
.verdict strong{font-size:1.125rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.csv-fallback{width:100%;min-height:140px;font-family:var(--font-num);font-size:.75rem}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:8px;font-weight:600;font-size:.9375rem;max-width:calc(100% - 32px);box-shadow:var(--shadow);transition:opacity .2s,transform .2s}
.toast[hidden]{display:none}
@media (min-width:768px){.toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  .top,.tabs,.no-print,body::before{display:none!important}
  main{padding:0;max-width:none}
  .card,.stat{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<header class="top">

function staffById(id){for(var i=0;i<S.staff.length;i++)if(S.staff[i].id===id)return S.staff[i];return null;}
function deptById(id){for(var i=0;i<S.departments.length;i++)if(S.departments[i].id===id)return S.departments[i];return null;}
function projById(id){for(var i=0;i<S.projects.length;i++)if(S.projects[i].id===id)return S.projects[i];return null;}
function deptColor(d){return DCOLS[(d&&d.c||0)%DCOLS.length];}
function personName(id){var p=staffById(id);return p?p.name:"Removed person";}
function managers(){return S.staff.filter(function(p){return p.dept==="mgt";});}

/* ---------- Cycles ---------- */
function anchor(){return parseYMD(S.settings.anchor);}
function cycleIndexOf(d){return Math.floor(dayDiff(anchor(),d)/S.settings.cycleDays);}
function cycleRange(i){var s=addDays(anchor(),i*S.settings.cycleDays);return {start:s,end:addDays(s,S.settings.cycleDays)};}
function curIdx(){return cycleIndexOf(new Date());}
function viewIdx(){return curIdx()+U.cycleOffset;}
function entriesIn(i){var r=cycleRange(i);return S.entries.filter(function(e){var t=new Date(e.start);return t>=r.start&&t<r.end;}).sort(function(a,b){return new Date(b.start)-new Date(a.start);});}
function summarize(i){
  var r=cycleRange(i), list=entriesIn(i);
  var s={range:r,list:list,approved:0,pending:0,rejected:0,byDept:{},byProject:{},byStaff:{},pendStaff:{},byDay:[],budget:S.settings.budgetHours*60};
  for(var k=0;k<S.settings.cycleDays;k++)s.byDay.push(0);
  list.forEach(function(e){
    if(e.status==="approved"){
      s.approved+=e.minutes;
      var p=staffById(e.staffId), dId=p?p.dept:"none";
      s.byDept[dId]=(s.byDept[dId]||0)+e.minutes;
      s.byProject[e.projectId]=(s.byProject[e.projectId]||0)+e.minutes;
      s.byStaff[e.staffId]=(s.byStaff[e.staffId]||0)+e.minutes;
      var di=dayDiff(r.start,new Date(e.start)); if(di>=0&&di<s.byDay.length)s.byDay[di]+=e.minutes/60;
    }else if(e.status==="pending"){s.pending+=e.minutes;s.pendStaff[e.staffId]=(s.pendStaff[e.staffId]||0)+e.minutes;}
    else s.rejected+=e.minutes;
  });
  s.remaining=s.budget-s.approved;
  return s;
}

/* ---------- Shared components ---------- */
function cycleNav(){
  var i=viewIdx(), r=cycleRange(i), cur=U.cycleOffset===0;
  var sub=cur?("Current cycle, day "+(Math.min(dayDiff(r.start,new Date()),S.settings.cycleDays-1)+1)+" of "+S.settings.cycleDays):(U.cycleOffset===-1?"Last cycle":"Past cycle");
  return '<div class="cyc no-print" role="group" aria-label="Choose a 2-week cycle">'+
    '<button class="icon-btn" data-act="cyc" data-d="-1" aria-label="Previous cycle">'+icon("left")+'</button>'+
    '<div class="cyc-t"><strong>'+esc(fmtRange(r))+'</strong><span>'+sub+'</span></div>'+
    '<button class="icon-btn" data-act="cyc" data-d="1" aria-label="Next cycle"'+(cur?" disabled":"")+'>'+icon("right")+'</button></div>';
}
function statTiles(s){
  var over=s.remaining<0, low=!over&&s.remaining<=s.budget*0.15;
  return '<div class="stats">'+
    tile("Paid hours",fmtH(s.budget),"per 2-week cycle","")+
    tile("Hours used",fmtH(s.approved),"approved work","")+
    (over?tile("Extra hours",fmtH(-s.remaining),"worked above the paid hours","is-extra")
         :tile("Hours left",fmtH(s.remaining),low?"almost used up":"before the paid hours run out",low?"is-low":""))+
    tile("Awaiting approval",fmtH(s.pending),"logged, not yet approved","")+
  '</div>';
  function tile(l,v,sub,cls){return '<div class="stat '+cls+'"><span class="eyebrow">'+l+'</span><span class="v">'+v+' <small>h</small></span><span class="s">'+sub+'</span></div>';}
}
function meter(s,showPending){
  var b=s.budget,a=s.approved,p=showPending?s.pending:0,scale=Math.max(b,a+p)||1;
  function w(v){return (v/scale*100).toFixed(2)+"%";}
  var within=Math.min(a,b), extra=Math.max(0,a-b);
  var lbl=fmtH(a)+" hours approved out of "+fmtH(b)+" paid hours"+(extra?", "+fmtH(extra)+" extra hours":"")+(p?", "+fmtH(p)+" hours awaiting approval":"");
  return '<div class="meter"><div class="meter-track" role="img" aria-label="'+lbl+'">'+
    (within?'<span class="sg sg-a" style="width:'+w(within)+'"></span>':"")+
    (extra?'<span class="sg sg-x" style="width:'+w(extra)+'"></span>':"")+
    (p?'<span class="sg sg-p" style="width:'+w(p)+'"></span>':"")+
    '<span class="mark" style="left:'+w(b)+'"><span>'+fmtH(b)+' h paid</span></span></div>'+
    '<ul class="legend"><li><span class="sw" style="background:var(--seg)"></span>Approved within paid hours ('+fmtH(within)+' h)</li>'+
    '<li><span class="sw" style="background:var(--seg-x)"></span>Extra hours ('+fmtH(extra)+' h)</li>'+
    (showPending?'<li><span class="sw sg-p"></span>Awaiting approval ('+fmtH(s.pending)+' h)</li>':"")+'</ul></div>';
}
function deptBars(s){
  var rows=S.departments.map(function(d){return {d:d,m:s.byDept[d.id]||0,n:S.staff.filter(function(p){return p.dept===d.id&&s.byStaff[p.id];}).length};});
  var max=Math.max.apply(null,rows.map(function(r){return r.m;}).concat([1]));
  return '<div class="hbars">'+rows.map(function(r){
    var share=s.approved?Math.round(r.m/s.approved*100):0;
    return '<div class="hbar"><div class="hbar-l"><span class="dot" style="background:'+deptColor(r.d)+'"></span><span>'+esc(r.d.name)+'</span></div>'+
      '<div class="hbar-t" aria-hidden="true"><span style="width:'+(r.m/max*100).toFixed(1)+'%;background:'+deptColor(r.d)+'"></span></div>'+
      '<div class="hbar-v">'+fmtH(r.m)+' h <small>'+share+'% · '+r.n+(r.n===1?" person":" people")+'</small></div></div>';
  }).join("")+'</div>';
}
function dailyChart(s){
  var n=s.byDay.length, mx=Math.max.apply(null,s.byDay.concat([1])), top=Math.max(2,Math.ceil(mx/2)*2);
  var W=640,H=210,L=34,R=8,T=12,B=40,pw=W-L-R,ph=H-T-B,bw=pw/n, todayI=U.cycleOffset===0?dayDiff(s.range.start,new Date()):-1;
  var g="";
  [0,top/2,top].forEach(function(v){var y=T+ph-v/top*ph;g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>';});
  s.byDay.forEach(function(v,i){
    var d=addDays(s.range.start,i), h=v/top*ph, x=L+i*bw+bw*0.18;
    if(v>0)g+='<rect class="'+(i===todayI?"bar-today":"bar")+'" x="'+x.toFixed(1)+'" y="'+(T+ph-h).toFixed(1)+'" width="'+(bw*0.64).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"><title>'+esc(fmtDay(d))+": "+v.toFixed(1)+' h</title></rect>';
    g+='<text class="ax" x="'+(L+i*bw+bw/2).toFixed(1)+'" y="'+(H-B+16)+'" text-anchor="middle">'+d.getDate()+'</text>';
    g+='<text class="ax" x="'+(L+i*bw+bw/2).toFixed(1)+'" y="'+(H-B+30)+'" text-anchor="middle">'+"SMTWTFS"[d.getDay()]+'</text>';
  });
  g+='<line class="base" x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'"/>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Approved hours per day in this cycle">'+g+'</svg>';
}
function projectTable(s){
  var rows=S.projects.map(function(p){return {p:p,m:s.byProject[p.id]||0};}).filter(function(r){return r.m>0;}).sort(function(a,b){return b.m-a.m;});
  if(!rows.length)return '<div class="empty">No approved hours in this cycle yet.</div>';
  return '<div class="tw"><table><thead><tr><th>Project</th><th class="r">Hours</th><th class="r">Share</th></tr></thead><tbody>'+
    rows.map(function(r){return '<tr><td>'+esc(r.p.name)+'</td><td class="r num">'+fmtH(r.m)+'</td><td class="r num">'+(s.approved?Math.round(r.m/s.approved*100):0)+'%</td></tr>';}).join("")+
    '</tbody><tfoot><tr><td>Total</td><td class="r num">'+fmtH(s.approved)+'</td><td class="r num">100%</td></tr></tfoot></table></div>';
}
function peopleTable(s,withPending){
  var rows=S.staff.map(function(p){return {p:p,m:s.byStaff[p.id]||0,q:s.pendStaff[p.id]||0};}).filter(function(r){return r.m||(withPending&&r.q);}).sort(function(a,b){return b.m-a.m;});
  if(!rows.length)return '<div class="empty">Nobody has logged hours in this cycle yet.</div>';
  return '<div class="tw"><table><thead><tr><th>Person</th><th>Role</th><th>Department</th><th class="r">Approved</th>'+(withPending?'<th class="r">Pending</th>':"")+'</tr></thead><tbody>'+
    rows.map(function(r){var d=deptById(r.p.dept);return '<tr><td class="nw">'+esc(r.p.name)+'</td><td>'+esc(r.p.role)+'</td><td class="nw"><span class="dot" style="display:inline-block;margin-right:6px;background:'+deptColor(d)+'"></span>'+esc(d?d.name:"")+'</td><td class="r num">'+fmtH(r.m)+'</td>'+(withPending?'<td class="r num">'+fmtH(r.q)+'</td>':"")+'</tr>';}).join("")+
    '</tbody></table></div>';
}
function pill(st){var t={approved:"Approved",pending:"Awaiting approval",rejected:"Rejected"}[st];return '<span class="pill p-'+st+'">'+t+'</span>';}
function methodPill(m){return m==="manual"?'<span class="pill p-manual">Typed in</span>':'<span class="pill p-timer">'+icon("clock").replace('class="ic"','class="ic" style="width:14px;height:14px"')+'Timer</span>';}
function entryItem(e,opts){
  opts=opts||{};
  var p=staffById(e.staffId), pr=projById(e.projectId), st=new Date(e.start), en=new Date(e.end), d=p?deptById(p.dept):null;
  var who=opts.showPerson?'<span class="small"><strong>'+esc(p?p.name:"Removed person")+'</strong> · '+esc(p?p.role:"")+' · '+esc(d?d.name:"")+'</span>':"";
  var h='<li class="entry"><div style="min-width:0">'+(who?'<div>'+who+'</div>':"")+
    '<div class="entry-top"><strong>'+esc(pr?pr.name:"Removed project")+'</strong>'+pill(e.status)+methodPill(e.method)+'</div>'+
    '<div class="entry-meta">'+esc(e.task)+' · '+esc(fmtDay(st))+' · '+hm(st)+' to '+hm(en)+'</div>'+
    '<p class="entry-note">'+esc(e.note)+'</p>'+
    (e.proof?'<p class="small"><a href="'+esc(e.proof)+'" target="_blank" rel="noopener noreferrer">'+icon("link").replace('class="ic"','class="ic" style="width:16px;height:16px;vertical-align:-3px"')+' Proof of work</a></p>':"")+
    (e.method==="manual"&&e.reason?'<p class="reason"><strong>Why typed in:</strong> '+esc(e.reason)+'</p>':"")+
    (e.status!=="pending"&&e.reviewerId?'<p class="small muted" style="margin-top:4px">'+(e.status==="approved"?"Approved":"Rejected")+' by '+esc(personName(e.reviewerId))+(e.reviewNote?': '+esc(e.reviewNote):"")+'</p>':"")+
    '</div><div class="entry-dur">'+fmtDur(e.minutes)+'</div>';
  if(opts.canDelete&&e.status==="pending")h+='<div class="entry-act"><button class="btn btn-ghost" data-act="del" data-id="'+e.id+'">'+icon("trash")+'Delete</button></div>';
  if(opts.review){
    if(U.rejecting===e.id){
      h+='<div class="reject-box"><div class="field"><label for="rej-'+e.id+'">Reason for rejecting</label><input id="rej-'+e.id+'" type="text" placeholder="For example: already logged, wrong project"><span class="err" id="rej-err" hidden>Add a short reason so the person knows what to fix.</span></div>'+
        '<div class="btns"><button class="btn btn-bad" data-act="reject-confirm" data-id="'+e.id+'">'+icon("x")+'Reject entry</button><button class="btn btn-ghost" data-act="reject-cancel">Cancel</button></div></div>';
    }else{
      h+='<div class="entry-act"><button class="btn btn-ok" data-act="approve" data-id="'+e.id+'">'+icon("check")+'Approve</button><button class="btn btn-bad" data-act="reject" data-id="'+e.id+'">'+icon("x")+'Reject</button></div>';
    }
  }
  return h+'</li>';
}
function options(list,sel,valKey,lblFn){return list.map(function(x){var v=valKey?x[valKey]:x;return '<option value="'+esc(v)+'"'+(v===sel?" selected":"")+'>'+esc(lblFn?lblFn(x):x)+'</option>';}).join("");}

  staff:[["track","Track time","clock"],["mine","My entries","list"],["overview","Overview","chart"]],
  manager:[["overview","Overview","chart"],["approvals","Approvals","inbox"],["entries","All entries","list"],["setup","Team and settings","sliders"]],
  client:[["report","Hours report","report"]]

}

/* ---------- Views ---------- */

  var t=S.timers[me.id], dr=U.draft[me.id]||(U.draft[me.id]={projectId:S.projects[0]&&S.projects[0].id,task:S.tasks[0],note:"",proof:""});
  var src=t||dr, active=!!t, running=t&&t.running;
  var s=summarize(curIdx());
  var mine=s.list.filter(function(e){return e.staffId===me.id;});
  var myA=mine.filter(function(e){return e.status==="approved";}).reduce(function(a,e){return a+e.minutes;},0);
  var myP=mine.filter(function(e){return e.status==="pending";}).reduce(function(a,e){return a+e.minutes;},0);
  var d=deptById(me.dept);
  var today=ymd(new Date()), r=cycleRange(curIdx());
  var h='<div class="head"><div><h2>Track time</h2><p>'+esc(me.name)+' · '+esc(me.role)+' · '+esc(d?d.name:"")+'</p></div></div>';

    '<span class="timer-state"><span class="pulse '+(running?"on":active?"paused":"idle")+'"></span>'+(running?"Running":active?"Paused":"Not started")+'</span></div>'+
    '<div class="clock" id="clock" aria-live="off">'+clock(t?elapsedMs(t):0)+'</div>'+
    '<div class="row2"><div class="field"><label for="t-proj">Project</label><select id="t-proj"'+(active?" disabled":"")+'>'+options(S.projects,src.projectId,"id",function(p){return p.name;})+'</select></div>'+
    '<div class="field"><label for="t-task">Type of work</label><select id="t-task"'+(active?" disabled":"")+'>'+options(S.tasks,src.task)+'</select></div></div>'+
    '<div class="field"><label for="t-note">What did you work on?</label><textarea id="t-note" aria-describedby="t-note-h t-note-err" placeholder="For example: built the payment page and fixed two bugs">'+esc(src.note)+'</textarea><span class="hint" id="t-note-h">The client sees this note in the report. Keep it short and clear.</span><span class="err" id="t-note-err" hidden></span></div>'+
    '<div class="field"><label for="t-proof">Proof link (optional)</label><input id="t-proof" type="url" inputmode="url" placeholder="Link to a file, design, commit or ticket" value="'+esc(src.proof)+'"></div>'+
    '<div class="btns">'+
    (!active?'<button class="btn btn-p" data-act="t-start">'+icon("play")+'Start timer</button>':
      (running?'<button class="btn" data-act="t-pause">'+icon("pause")+'Pause</button>':'<button class="btn" data-act="t-resume">'+icon("play")+'Resume</button>')+
      '<button class="btn btn-p" data-act="t-stop">'+icon("stop")+'Stop and submit</button>'+
      (U.discardArm?'<button class="btn btn-bad" data-act="t-discard-yes">Yes, discard</button><button class="btn btn-ghost" data-act="t-discard-no">Keep timer</button>':'<button class="btn btn-ghost" data-act="t-discard">Discard</button>')
    )+'</div>'+
    (active?'<div class="demo-note no-print">'+icon("info")+'<span>Demo only: <button class="btn btn-ghost" style="min-height:36px;padding:0 8px" data-act="t-skip">'+icon("forward")+'Add 30 minutes</button> so you can show a full entry without waiting.</span></div>':"")+
    '<details class="manual"'+(U.manualOpen?" open":"")+'><summary>Forgot to start the timer? Type in your hours</summary>'+

    '<form id="manual-form" novalidate>'+
    '<div class="row2 row3"><div class="field"><label for="m-date">Date</label><input id="m-date" type="date" required min="'+ymd(r.start)+'" max="'+today+'" value="'+today+'"></div>'+
    '<div class="field"><label for="m-start">Start</label><input id="m-start" type="time" required value="09:00"></div>'+

    '<div class="stat"><span class="eyebrow">You logged</span><span class="v">'+fmtH(myA+myP)+' <small>h</small></span><span class="s">'+fmtH(myA)+' h approved</span></div>'+
    (s.remaining<0?'<div class="stat is-extra"><span class="eyebrow">Client extra hours</span><span class="v">'+fmtH(-s.remaining)+' <small>h</small></span><span class="s">above the '+fmtH(s.budget)+' h paid</span></div>':
    '<div class="stat"><span class="eyebrow">Client hours left</span><span class="v">'+fmtH(s.remaining)+' <small>h</small></span><span class="s">of '+fmtH(s.budget)+' h paid</span></div>')+'</div>'+
    meter(s,true)+

    (mine.length?'<ul class="entries">'+mine.slice(0,3).map(function(e){return entryItem(e,{canDelete:true});}).join("")+'</ul>':'<div class="empty">You have not logged time in this cycle yet. Start the timer when you begin a task.</div>')+
    '</section></div>';
  return h;
}
function elapsedMs(t){return t.accMs+(t.running?Date.now()-t.startedAt:0);}

function viewMine(){
  var me=staffById(U.staffId); var list=entriesIn(viewIdx()).filter(function(e){return me&&e.staffId===me.id;});
  var tot=list.filter(function(e){return e.status!=="rejected";}).reduce(function(a,e){return a+e.minutes;},0);
  return '<div class="head"><div><h2>My entries</h2><p>'+fmtH(tot)+' h logged in this cycle. You can delete an entry while it is awaiting approval.</p></div>'+cycleNav()+'</div>'+
    (list.length?'<ul class="entries">'+list.map(function(e){return entryItem(e,{canDelete:true});}).join("")+'</ul>':'<div class="empty">No entries in this cycle.</div>');
}

function viewOverview(){
  var s=summarize(viewIdx()), last=summarize(viewIdx()-1);
  var h='<div class="head"><div><h2>Overview</h2><p>All departments working for '+esc(S.settings.clientName)+'. Only approved hours count against the '+fmtH(s.budget)+' paid hours.</p></div>'+cycleNav()+'</div>';
  h+=statTiles(s);
  h+='<section class="card"><div class="card-h"><h3>Paid hours used</h3><span class="small muted">Resets every '+S.settings.cycleDays+' days</span></div>'+meter(s,true)+
    (last.approved?'<p class="small muted">Previous cycle: '+fmtH(last.approved)+' h approved against '+fmtH(last.budget)+' h paid'+(last.approved>last.budget?', which is '+fmtH(last.approved-last.budget)+' h extra.':'.')+'</p>':"")+'</section>';
  h+='<div class="grid2"><section class="card"><div class="card-h"><h3>Hours by department</h3><span class="small muted">Approved</span></div>'+deptBars(s)+'</section>'+
    '<section class="card"><div class="card-h"><h3>Hours per day</h3><span class="small muted">Approved, '+esc(fmtRange(s.range))+'</span></div>'+dailyChart(s)+'</section></div>';
  h+='<div class="grid2"><section class="card"><h3>Hours by project</h3>'+projectTable(s)+'</section><section class="card"><h3>Who worked</h3>'+peopleTable(s,true)+'</section></div>';
  return h;
}

function viewApprovals(){
  var list=S.entries.filter(function(e){return e.status==="pending";}).sort(function(a,b){return new Date(a.start)-new Date(b.start);});
  var nTimer=list.filter(function(e){return e.method==="timer";}).length;
  var h='<div class="head"><div><h2>Approvals</h2><p>Check each entry before it counts against the client\'s paid hours. Typed-in entries show the reason the timer was not used.</p></div>'+
    (nTimer?'<button class="btn btn-ok" data-act="approve-timers">'+icon("check")+'Approve all '+nTimer+' timer entries</button>':"")+'</div>';
  h+=list.length?'<ul class="entries">'+list.map(function(e){return entryItem(e,{showPerson:true,review:true});}).join("")+'</ul>':'<div class="empty">Nothing waiting. All entries are reviewed.</div>';
  return h;
}

function viewEntries(){
  var list=entriesIn(viewIdx()).filter(function(e){
    var p=staffById(e.staffId);
    return (U.filterDept==="all"||(p&&p.dept===U.filterDept))&&(U.filterStatus==="all"||e.status===U.filterStatus);
  });
  var h='<div class="head"><div><h2>All entries</h2><p>'+list.length+' entries, '+fmtH(list.reduce(function(a,e){return a+e.minutes;},0))+' h in this view.</p></div>'+cycleNav()+'</div>';
  h+='<div class="row2" style="max-width:560px"><div class="field"><label for="f-dept">Department</label><select id="f-dept" data-act="filter"><option value="all">All departments</option>'+options(S.departments,U.filterDept,"id",function(d){return d.name;})+'</select></div>'+
    '<div class="field"><label for="f-status">Status</label><select id="f-status" data-act="filter">'+[["all","All"],["approved","Approved"],["pending","Awaiting approval"],["rejected","Rejected"]].map(function(o){return '<option value="'+o[0]+'"'+(U.filterStatus===o[0]?" selected":"")+'>'+o[1]+'</option>';}).join("")+'</select></div></div>';
  h+=list.length?'<ul class="entries">'+list.map(function(e){return entryItem(e,{showPerson:true});}).join("")+'</ul>':'<div class="empty">No entries match these filters.</div>';
  return h;
}

function viewSetup(){
  var st=S.settings;
  var h='<div class="head"><div><h2>Team and settings</h2><p>Set the paid hours and cycle, and load the real team from Airtable.</p></div></div>';
  h+='<div class="grid2"><section class="card"><h3>Client and hours</h3><form id="settings-form" novalidate style="display:grid;gap:12px">'+
    '<div class="field"><label for="s-client">Client name</label><input id="s-client" type="text" required value="'+esc(st.clientName)+'"></div>'+
    '<div class="row2"><div class="field"><label for="s-hours">Paid hours per cycle</label><input id="s-hours" type="number" min="1" step="0.5" required value="'+st.budgetHours+'"></div>'+
    '<div class="field"><label for="s-days">Cycle length (days)</label><input id="s-days" type="number" min="1" max="62" required value="'+st.cycleDays+'"></div></div>'+
    '<div class="field"><label for="s-anchor">First day of a cycle</label><input id="s-anchor" type="date" required value="'+esc(st.anchor)+'"><span class="hint">Cycles repeat from this date. Hours reset at the start of each cycle.</span></div>'+
    '<span class="err" id="s-err" role="alert" hidden></span>'+
    '<div class="btns"><button class="btn btn-p" type="submit">'+icon("check")+'Save settings</button></div></form></section>';
  h+='<section class="card"><h3>Load the team from Airtable</h3><p class="small muted">Paste the JSON that Claude in Chrome gives you from the Airtable base. This replaces the sample team and clears the sample entries.</p>'+
    '<div class="field"><label for="imp">Team JSON</label><textarea id="imp" class="csv-fallback" placeholder=\'{"departments":[{"name":"ICT"}],"staff":[{"name":"...","role":"...","department":"ICT"}],"projects":[{"name":"..."}]}\'></textarea><span class="err" id="imp-err" role="alert" hidden></span></div>'+
    '<div class="btns"><button class="btn btn-p" data-act="import">'+icon("download")+'Import team</button>'+
    (U.resetArm?'<button class="btn btn-bad" data-act="reset-yes">Yes, reset everything</button><button class="btn btn-ghost" data-act="reset-no">Cancel</button>':'<button class="btn btn-ghost" data-act="reset">Reset demo data</button>')+'</div></section></div>';
  h+='<section class="card"><div class="card-h"><h3>Team</h3><span class="small muted">'+(st.sample?"Sample team for the demo. Replace with the real staff list.":S.staff.length+" people")+'</span></div>'+
    '<div class="tw"><table><thead><tr><th>Name</th><th>Role</th><th>Department</th></tr></thead><tbody>'+
    S.staff.map(function(p){var d=deptById(p.dept);return '<tr><td class="nw">'+esc(p.name)+'</td><td>'+esc(p.role)+'</td><td class="nw"><span class="dot" style="display:inline-block;margin-right:6px;background:'+deptColor(d)+'"></span>'+esc(d?d.name:"")+'</td></tr>';}).join("")+
    '</tbody></table></div><h3>Projects</h3><ul class="small" style="margin:0;padding-left:20px">'+S.projects.map(function(p){return '<li>'+esc(p.name)+'</li>';}).join("")+'</ul></section>';
  return h;
}

function viewReport(){
  var s=summarize(viewIdx()), over=s.approved>s.budget, pct=s.budget?Math.round(s.approved/s.budget*100):0;
  var log=s.list.filter(function(e){return e.status==="approved";});
  var h='<div class="head"><div class="rep-brand"><span class="logo logo-lg"><img src="'+LOGO+'" alt="Pillar 5, Above Average"></span><div><span class="eyebrow">Hours report</span><h2>'+esc(S.settings.clientName)+'</h2><p>Work done by Pillar 5 Group, '+esc(fmtRange(s.range))+'. Every entry below was approved by a manager.</p></div></div>'+cycleNav()+'</div>';
  h+='<div class="verdict '+(over?"v-extra":"v-normal")+'"><strong>'+(over?
      'Pillar 5 delivered '+fmtH(s.approved)+' hours. That is '+fmtH(s.approved-s.budget)+' hours more than the '+fmtH(s.budget)+' paid hours.':
      fmtH(s.approved)+' of '+fmtH(s.budget)+' paid hours used so far ('+pct+'%).')+'</strong>'+
    '<span class="small">'+Object.keys(s.byStaff).length+' people from '+Object.keys(s.byDept).length+' departments worked on '+Object.keys(s.byProject).length+' projects in this cycle.</span></div>';
  h+='<section class="card"><h3>Paid hours used</h3>'+meter(s,false)+'</section>';
  h+='<div class="grid2"><section class="card"><h3>Hours by department</h3>'+deptBars(s)+'</section><section class="card"><h3>Hours by project</h3>'+projectTable(s)+'</section></div>';
  h+='<section class="card"><div class="card-h"><h3>Work log</h3><div class="toolbar no-print">'+
    '<button class="btn" data-act="copy-csv">'+icon("copy")+'Copy as CSV</button>'+
    (FRAMED?"":'<button class="btn" data-act="dl-csv">'+icon("download")+'Download CSV</button><button class="btn" data-act="print">'+icon("print")+'Print or save PDF</button>')+
    '</div></div>'+(U.csvFallback?'<label class="lbl" for="csv-fb">Copy failed. Select this text and copy it.</label><textarea id="csv-fb" class="csv-fallback" readonly>'+esc(U.csvFallback)+'</textarea>':"")+
    (log.length?'<div class="tw"><table><thead><tr><th>Date</th><th>Person</th><th>Department</th><th>Project</th><th>Work done</th><th class="r">Hours</th></tr></thead><tbody>'+
      log.map(function(e){var p=staffById(e.staffId),d=p?deptById(p.dept):null,pr=projById(e.projectId);
        return '<tr><td class="nw">'+esc(fmtDay(new Date(e.start)))+'</td><td class="nw">'+esc(p?p.name:"")+'<br><span class="muted">'+esc(p?p.role:"")+'</span></td><td class="nw">'+esc(d?d.name:"")+'</td><td>'+esc(pr?pr.name:"")+'</td><td class="note-cell">'+esc(e.task)+': '+esc(e.note)+'</td><td class="r num">'+fmtH(e.minutes)+'</td></tr>';}).join("")+
      '</tbody><tfoot><tr><td colspan="5">Total approved</td><td class="r num">'+fmtH(s.approved)+'</td></tr></tfoot></table></div>':'<div class="empty">No approved work in this cycle yet.</div>')+
    '</section>';
  return h;
}

/* ---------- CSV ---------- */
function csvFor(i){
  var rows=[["Date","Start","End","Person","Role","Department","Project","Type of work","Hours","Note","Logged by","Approved by"]];
  entriesIn(i).filter(function(e){return e.status==="approved";}).reverse().forEach(function(e){
    var p=staffById(e.staffId),d=p?deptById(p.dept):null,pr=projById(e.projectId),st=new Date(e.start),en=new Date(e.end);
    rows.push([ymd(st),hm(st),hm(en),p?p.name:"",p?p.role:"",d?d.name:"",pr?pr.name:"",e.task,fmtH(e.minutes),e.note,e.method==="manual"?"Typed in":"Timer",personName(e.reviewerId)]);
  });
  return rows.map(function(r){return r.map(function(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",");}).join("\n");
}

/* ---------- Render ---------- */
function render(focusMain){
  var ok=TABS[U.role].some(function(t){return t[0]===U.tab;}); if(!ok)U.tab=TABS[U.role][0][0];
  renderHeader();
  var v={track:viewTrack,mine:viewMine,overview:viewOverview,approvals:viewApprovals,entries:viewEntries,setup:viewSetup,report:viewReport}[U.tab];
  var m=document.getElementById("main"); m.innerHTML=v();
  if(focusMain){m.focus({preventScroll:true});window.scrollTo(0,0);}
  save();
}
var toastT;
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},3200);}
function showErr(id,msg,fieldId){var el=document.getElementById(id);if(!el)return;el.textContent=msg;el.hidden=!msg;if(fieldId){var f=document.getElementById(fieldId);if(f){f.setAttribute("aria-invalid",msg?"true":"false");if(msg)f.focus();}}}

/* ---------- Actions ---------- */
function act(a,el){
  var me=U.staffId, t=S.timers[me];
  switch(a){
    case "role": U.role=el.getAttribute("data-role"); U.tab=TABS[U.role][0][0]; U.cycleOffset=0; U.rejecting=null; render(true); break;
    case "tab": U.tab=el.getAttribute("data-tab"); U.cycleOffset=0; U.csvFallback=null; render(true); break;
    case "cyc": U.cycleOffset=Math.min(0,U.cycleOffset+Number(el.getAttribute("data-d"))); U.csvFallback=null; render(); break;
    case "t-start":
      var dr=U.draft[me]; dr.projectId=val("t-proj"); dr.task=val("t-task"); dr.note=val("t-note"); dr.proof=val("t-proof");
      S.timers[me]={projectId:dr.projectId,task:dr.task,note:dr.note,proof:dr.proof,startedAt:Date.now(),accMs:0,running:true};
      U.draft[me]=null; render(); toast("Timer started"); break;
    case "t-pause": if(t){t.accMs+=Date.now()-t.startedAt;t.running=false;render();} break;
    case "t-resume": if(t){t.startedAt=Date.now();t.running=true;render();} break;
    case "t-skip": if(t){t.accMs+=30*60000;render();} break;
    case "t-discard": U.discardArm=true; render(); break;
    case "t-discard-no": U.discardArm=false; render(); break;
    case "t-discard-yes": delete S.timers[me]; U.discardArm=false; render(); toast("Timer discarded"); break;
    case "t-stop":
      if(!t)break; t.note=val("t-note"); t.proof=val("t-proof");
      var ms=elapsedMs(t), mins=Math.round(ms/60000);
      if(t.note.trim().length<5){showErr("t-note-err","Write a short note on what you did before you submit.","t-note");break;}
      if(mins<1){showErr("t-note-err","The timer ran for less than a minute. Keep it running, or discard it.");break;}
      var end=new Date(), start=new Date(end.getTime()-mins*60000);
      addEntry({staffId:me,projectId:t.projectId,task:t.task,note:t.note.trim(),proof:t.proof.trim(),start:start,end:end,minutes:mins,method:"timer",reason:""});
      delete S.timers[me]; U.discardArm=false; render(); break;
    case "del": S.entries=S.entries.filter(function(e){return !(e.id===el.getAttribute("data-id")&&e.status==="pending");}); render(); toast("Entry deleted"); break;
    case "approve": review(el.getAttribute("data-id"),"approved",""); render(); toast("Entry approved"); break;
    case "approve-timers": var n=0; S.entries.forEach(function(e){if(e.status==="pending"&&e.method==="timer"){setReview(e,"approved","");n++;}}); render(); toast(n+" entries approved"); break;
    case "reject": U.rejecting=el.getAttribute("data-id"); render(); var f=document.getElementById("rej-"+U.rejecting); if(f)f.focus(); break;
    case "reject-cancel": U.rejecting=null; render(); break;
    case "reject-confirm":
      var id=el.getAttribute("data-id"), why=val("rej-"+id).trim();
      if(!why){var er=document.getElementById("rej-err");er.hidden=false;document.getElementById("rej-"+id).setAttribute("aria-invalid","true");document.getElementById("rej-"+id).focus();break;}
      review(id,"rejected",why); U.rejecting=null; render(); toast("Entry rejected"); break;
    case "copy-csv":
      var csv=csvFor(viewIdx());
      try{navigator.clipboard.writeText(csv).then(function(){U.csvFallback=null;toast("Work log copied as CSV");},function(){U.csvFallback=csv;render();selectFb();});}
      catch(e){U.csvFallback=csv;render();selectFb();}
      break;
    case "dl-csv":
      var blob=new Blob([csvFor(viewIdx())],{type:"text/csv"}), a2=document.createElement("a"), r=cycleRange(viewIdx());
      a2.href=URL.createObjectURL(blob); a2.download="hours-report-"+ymd(r.start)+".csv"; document.body.appendChild(a2); a2.click(); a2.remove(); break;
    case "print": window.print(); break;
    case "import": doImport(); break;
    case "reset": U.resetArm=true; render(); break;
    case "reset-no": U.resetArm=false; render(); break;
    case "reset-yes": S=sampleData(); var role=U.role; U=defaultUI(); U.role=role; U.tab="setup"; render(); toast("Demo data reset"); break;
  }
}
function selectFb(){var f=document.getElementById("csv-fb");if(f){f.focus();f.select();}}
function val(id){var e=document.getElementById(id);return e?e.value:"";}
function addEntry(o){
  var e={id:uid(),staffId:o.staffId,projectId:o.projectId,task:o.task,note:o.note,proof:o.proof||"",start:o.start.toISOString(),end:o.end.toISOString(),minutes:o.minutes,method:o.method,reason:o.reason||"",status:"pending",reviewerId:null,reviewNote:"",reviewedAt:null,createdAt:new Date().toISOString()};
  S.entries.push(e);
  var s=summarize(cycleIndexOf(o.start));
  toast(fmtDur(o.minutes)+" submitted for approval"+(s.approved+s.pending>s.budget?". This cycle is now above the paid hours.":""));
}
function setReview(e,st,note){e.status=st;e.reviewerId=U.managerId;e.reviewNote=note;e.reviewedAt=new Date().toISOString();}
function review(id,st,note){S.entries.forEach(function(e){if(e.id===id)setReview(e,st,note);});}
function doImport(){
  var raw=val("imp").trim(), d;
  try{d=JSON.parse(raw);}catch(e){showErr("imp-err","This is not valid JSON. Copy the full block from Claude, including the curly brackets.","imp");return;}
  if(!d||!Array.isArray(d.staff)||!d.staff.length){showErr("imp-err","The JSON needs a \"staff\" list with at least one person.","imp");return;}
  var depts=[], map={};
  function dept(name){name=String(name||"Unassigned").trim();var k=name.toLowerCase();if(!map[k]){map[k]={id:"d"+depts.length,name:name,c:depts.length};depts.push(map[k]);}return map[k].id;}
  (d.departments||[]).forEach(function(x){dept(x.name||x);});
  var staff=d.staff.map(function(p,i){return {id:"s"+i,name:String(p.name||"Unnamed"),role:String(p.role||""),dept:dept(p.department)};});
  if(!depts.some(function(x){return x.name.toLowerCase()==="management";}))dept("Management");
  depts.forEach(function(x){if(x.name.toLowerCase()==="management")x.id="mgt";});
  // Management keeps the id "mgt" so the manager picker can find it
  var byName={}; depts.forEach(function(x,i){byName["d"+i]=x.id;}); staff.forEach(function(p){p.dept=byName[p.dept]||p.dept;});
  var projects=(Array.isArray(d.projects)&&d.projects.length?d.projects:[{name:"General work"}]).map(function(p,i){return {id:"p"+i,name:String(p.name||p)};});
  S.departments=depts; S.staff=staff; S.projects=projects; S.entries=[]; S.timers={}; S.settings.sample=false;
  if(d.clientName)S.settings.clientName=String(d.clientName);
  U.staffId=staff[0].id; var mg=managers(); U.managerId=mg[0]?mg[0].id:staff[0].id; U.draft={};
  render(); toast("Imported "+staff.length+" people and "+projects.length+" projects");
}

/* ---------- Events ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]"); if(!el||el.tagName==="SELECT")return;
  act(el.getAttribute("data-act"),el);
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.id==="who-staff"){U.staffId=el.value;U.discardArm=false;render();}
  else if(el.id==="who-mgr"){U.managerId=el.value;render();}
  else if(el.id==="f-dept"){U.filterDept=el.value;render();document.getElementById("f-dept").focus();}
  else if(el.id==="f-status"){U.filterStatus=el.value;render();document.getElementById("f-status").focus();}
  else if(el.id==="t-proj"||el.id==="t-task"){var dr=U.draft[U.staffId];if(dr){dr.projectId=val("t-proj");dr.task=val("t-task");}}
});
document.addEventListener("input",function(ev){
  var id=ev.target.id;
  if(id==="t-note"||id==="t-proof"){
    var t=S.timers[U.staffId]||U.draft[U.staffId]; if(t){t[id==="t-note"?"note":"proof"]=ev.target.value; if(S.timers[U.staffId])save();}
    if(id==="t-note"&&ev.target.getAttribute("aria-invalid")==="true"&&ev.target.value.trim().length>=5)showErr("t-note-err","","t-note");
  }
});
document.addEventListener("toggle",function(ev){if(ev.target.classList&&ev.target.classList.contains("manual"))U.manualOpen=ev.target.open;},true);
document.addEventListener("focusout",function(ev){
  var f=ev.target; if(!f.closest||!f.closest("#manual-form"))return;
  if(f.required&&!f.value.trim())f.setAttribute("aria-invalid","true"); else f.removeAttribute("aria-invalid");
});
document.addEventListener("submit",function(ev){
  ev.preventDefault();
  if(ev.target.id==="manual-form"){
    var date=val("m-date"), s=val("m-start"), e=val("m-end"), note=val("m-note").trim(), why=val("m-reason").trim();
    if(!date||!s||!e){showErr("m-err","Fill in the date, start and end time.","m-date");return;}
    var st=parseYMD(date), sp=s.split(":"), ep=e.split(":"); st.setHours(+sp[0],+sp[1],0,0);
    var en=parseYMD(date); en.setHours(+ep[0],+ep[1],0,0);
    if(en<=st){showErr("m-err","The end time must be after the start time.","m-end");return;}
    if(en>new Date()){showErr("m-err","You cannot log time in the future.","m-end");return;}
    if(note.length<5){showErr("m-err","Write a short note on what you did.","m-note");return;}
    if(!why){showErr("m-err","Add the reason the timer was not used.","m-reason");return;}
    addEntry({staffId:U.staffId,projectId:val("m-proj"),task:val("m-task"),note:note,proof:"",start:st,end:en,minutes:Math.round((en-st)/60000),method:"manual",reason:why});
    U.manualOpen=false; render();
  }else if(ev.target.id==="settings-form"){
    var h=parseFloat(val("s-hours")), dd=parseInt(val("s-days"),10), an=val("s-anchor"), cn=val("s-client").trim();
    if(!cn){showErr("s-err","Add the client name.","s-client");return;}
    if(!(h>0)){showErr("s-err","Paid hours must be more than 0.","s-hours");return;}
    if(!(dd>=1&&dd<=62)){showErr("s-err","Cycle length must be between 1 and 62 days.","s-days");return;}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(an)){showErr("s-err","Pick the first day of a cycle.","s-anchor");return;}
    S.settings.clientName=cn; S.settings.budgetHours=h; S.settings.cycleDays=dd; S.settings.anchor=an;
    render(); toast("Settings saved");
  }
});
setInterval(function(){
  var t=S.timers[U.staffId], c=document.getElementById("clock");
  if(c&&t&&t.running)c.textContent=clock(elapsedMs(t));
},1000);

load(); render();
})();
</script>
